[package]
name = "macs3"
kind = "tool"
version = "3.0.4"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/macs3"

[command]
name = "taf-macs3"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/macs3:3.0.4-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["ChIP-seq", "ATAC-seq", "peak-calling", "epigenomics", "genomics"]
keywords = ["MACS3", "MACS", "ChIP-seq", "ATAC-seq", "peak calling", "broad peaks", "bedGraph", "hmmratac", "callpeak", "pileup", "bdgcmp"]
description = "MACS3 3.0.4 runtime for ChIP-seq, ATAC-seq, DNA enrichment peak calling, bedGraph operations, and HMMRATAC."

[upstream]
name = "MACS3"
type = "github"
repo = "macs3-project/MACS"
homepage = "https://macs3-project.github.io/MACS/"
manual = "https://macs3-project.github.io/MACS/"
release_url = "https://github.com/macs3-project/MACS/releases/tag/v3.0.4"
downloads = "https://files.pythonhosted.org/packages/d5/fc/7c5e99b12260372918521d52e3749b14ffc277b092a959bbe04550425e49/macs3-3.0.4.tar.gz"
version = "3.0.4"
commit = "e8ff0409e11d743d00c12ef44361f19ea5df9161"
license = "BSD-3-Clause"
citation = "Zhang et al. 2008, Model-based Analysis of ChIP-Seq (MACS)"
doi = "10.1186/gb-2008-9-9-r137"
pmid = "18798982"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 600
exist = ["macs3", "python", "python3", "bash", "sh", "grep", "sed", "gzip", "ldd"]
test = ["set -eu; macs3 --version 2>&1 | grep -F '3.0.4' >/dev/null && macs3 --help 2>&1 | grep -F 'callpeak' >/dev/null && macs3 --help 2>&1 | grep -F 'hmmratac' >/dev/null && macs3 callpeak --help 2>&1 | grep -F 'callpeak' >/dev/null && macs3 bdgpeakcall --help 2>&1 | grep -F 'bdgpeakcall' >/dev/null && macs3 hmmratac --help 2>&1 | grep -F 'hmmratac' >/dev/null", "set -eu; python -c 'import importlib.metadata as md; import MACS3, numpy, scipy, sklearn, hmmlearn, cykhash; assert md.version(\"MACS3\") == \"3.0.4\"; print(\"macs3-runtime-ok\", md.version(\"numpy\"), md.version(\"scipy\"), md.version(\"scikit-learn\"), md.version(\"hmmlearn\"), md.version(\"cykhash\"))' | grep -F 'macs3-runtime-ok' >/dev/null && grep -F 'source_sha256=1c2c9cc219d136b026b5e517dcbc518c3f76b9c864b8b52f00c7902f11070aef' /opt/macs3/share/doc/macs3/source.txt >/dev/null && find /opt/macs3/venv -type f -name '*.so' -print0 | xargs -0 -r ldd > /tmp/taf-macs3-ldd.txt && ! grep -F 'not found' /tmp/taf-macs3-ldd.txt >/dev/null", "set -eu; tmp=/tmp/taf-macs3-callpeak-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; python /opt/macs3/share/testdata/macs3_smoke.py \"$tmp\"; cd \"$tmp\"; macs3 callpeak -t reads.bed -f BED -g 1000 -n smoke --outdir callpeak --nomodel --extsize 50 --shift 0 --keep-dup all -B --nolambda -p 0.99 > callpeak.log 2>&1; test -s callpeak/smoke_peaks.xls; test -s callpeak/smoke_treat_pileup.bdg; grep -F 'chr1' callpeak/smoke_treat_pileup.bdg >/dev/null; grep -F 'Done!' callpeak.log >/dev/null; rm -rf \"$tmp\"", "set -eu; tmp=/tmp/taf-macs3-bdgpeakcall-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; python /opt/macs3/share/testdata/macs3_smoke.py \"$tmp\"; cd \"$tmp\"; macs3 bdgpeakcall -i signal.bdg -c 5 -l 20 -g 10 -o peaks.bed > bdgpeakcall.log 2>&1; test -s peaks.bed; grep -F 'chr1' peaks.bed >/dev/null; rm -rf \"$tmp\""]
